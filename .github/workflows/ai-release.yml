name: Release PathOfAIBuilding

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Build clean portable archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 scripts/package_release.py --version "$VERSION"
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" --jq '.object.sha')"
          gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT}" --jq '.message' > release-notes.md
          test -s release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/*.zip dist/SHA256SUMS.txt \
            --verify-tag \
            --title "PathOfAIBuilding $GITHUB_REF_NAME" \
            --notes-file release-notes.md
